name: eslint-pr
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  eslint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          npm install --no-save \
            eslint@^9 \
            eslint-plugin-es \
            eslint-plugin-es-x \
            globals

      - name: Write eslint.config.cjs
        run: |
          rm eslint.config.*
          cat > eslint.config.cjs <<'EOF'
          const globals = require("globals");
          const esx = require("eslint-plugin-es-x");
          const { FlatCompat } = require("@eslint/eslintrc");
          const js = require("@eslint/js");

          const compat = new FlatCompat({
            baseDirectory: __dirname,
            recommendedConfig: js.configs.recommended,
            allConfig: js.configs.all
          });

          module.exports = [
            {
              ignores: [
                "boot/sjcl.js",
                "core/modules/utils/base64-utf8/base64-utf8.module.js",
                "core/modules/utils/base64-utf8/base64-utf8.module.min.js",
                "core/modules/utils/diff-match-patch/diff_match_patch.js",
                "core/modules/utils/diff-match-patch/diff_match_patch_uncompressed.js",
                "core/modules/utils/dom/csscolorparser.js",
                "plugins/tiddlywiki/*/files/",
                "eslint.config.cjs",
                "playwright.config.js",
              ],
            },
            ...compat.extends("eslint:recommended"),
            {
              languageOptions: {
                ecmaVersion: 2017,
                sourceType: "commonjs",
                globals: {
                  ...globals.browser,
                  ...globals.commonjs,
                  ...globals.node,
                  $tw: "writable",
                },
              },
              plugins: {

              },
              rules: {

              },
            },
            // Add eslint-plugin-es-x bundled flat configs for newer syntax built-ins
            esx.configs['flat/no-new-in-es2018'],
            esx.configs['flat/no-new-in-es2019'],
            esx.configs['flat/no-new-in-es2020'],
            esx.configs['flat/no-new-in-es2021'],
            esx.configs['flat/no-new-in-es2022'],
            esx.configs['flat/no-new-in-es2023-intl-api'],
          ];
          EOF

      - name: Setup Reviewdog
        uses: reviewdog/action-setup@v1

      - name: Run ESLint with Reviewdog
        run: |
          npx eslint . -f json | reviewdog \
            -f=eslint \
            -reporter=github-pr-check \
            -filter-mode=diff_context
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
