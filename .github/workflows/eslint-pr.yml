name: eslint-pr
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  eslint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ESLint dependencies
        run: |
          npm install --no-save \
            eslint@^9 \
            @eslint/js \
            eslint-plugin-es \
            eslint-plugin-es-x \
            globals

      - name: Write ESLint flat config (CommonJS)
        run: |
          cat > eslint.config.cjs <<'EOF'
          const js = require("@eslint/js");
          const esx = require("eslint-plugin-es-x");
          const globals = require("globals");

          module.exports = [
            {
              ignores: [
                "boot/sjcl.js",
                "core/modules/utils/base64-utf8/base64-utf8.module.js",
                "core/modules/utils/base64-utf8/base64-utf8.module.min.js",
                "core/modules/utils/diff-match-patch/diff_match_patch.js",
                "core/modules/utils/diff-match-patch/diff_match_patch_uncompressed.js",
                "core/modules/utils/dom/csscolorparser.js",
                "plugins/tiddlywiki/*/files/",
                "eslint.config.cjs",
                "playwright.config.js",
              ],
            },
            js.configs.recommended,
            esx.configs["plugin:es-x/no-new-in-es2018"],
            {
              languageOptions: {
                ecmaVersion: 2017,
                sourceType: "commonjs",
                globals: {
                  ...globals.browser,
                  ...globals.commonjs,
                  ...globals.node,
                  $tw: "writable",
                },
              },
              rules: {
                // ES2017 style + no ES2018+ features
                "arrow-body-style": "error",
                "arrow-parens": ["error", "as-needed"],
                "arrow-spacing": ["error", { after: true, before: true }],
                "class-methods-use-this": "error",
                "default-case-last": "error",
                "default-param-last": "error",
                "generator-star-spacing": "error",
                "grouped-accessor-pairs": "error",
                "id-blacklist": "error",
                "id-denylist": "error",
                "id-match": "error",
                "implicit-arrow-linebreak": "error",
                "jsx-quotes": "error",
                "lines-between-class-members": "error",
                "max-classes-per-file": "error",
                "max-nested-callbacks": "error",
                "no-await-in-loop": "error",
                "no-caller": "error",
                "no-confusing-arrow": "error",
                "no-constant-condition": ["error", { checkLoops: false }],
                "no-constructor-return": "error",
                "no-duplicate-imports": "error",
                "no-iterator": "error",
                "no-loss-of-precision": "error",
                "no-multi-str": "error",
                "no-negated-in-lhs": "error",
                "no-new-require": "error",
                "no-new-wrappers": "error",
                "no-octal-escape": "error",
                "no-path-concat": "error",
                "no-promise-executor-return": "error",
                "no-restricted-globals": ["error", "self"],
                "no-unreachable-loop": "error",
                "no-useless-computed-key": "error",
                "no-useless-constructor": "error",
                "no-useless-rename": "error",
                "no-whitespace-before-property": "error",
                "prefer-numeric-literals": "error",
                "prefer-promise-reject-errors": "error",
                "quotes": ["error", "double", { avoidEscape: true }],
                "require-atomic-updates": "error",
                "require-await": "error",
                "rest-spread-spacing": "error",
                "sort-imports": "error",
                "symbol-description": "error",
                "template-curly-spacing": "error",
                "template-tag-spacing": "error",
                "unicode-bom": ["error", "never"],
                "valid-typeof": ["error", { requireStringLiterals: false }],
                "yield-star-spacing": "error",
              },
            },
          ];
          EOF

      - name: Setup Reviewdog
        uses: reviewdog/action-setup@v1

      - name: Run ESLint with Reviewdog
        run: |
          npx eslint . -f json | reviewdog \
            -f=eslint \
            -reporter=github-pr-check \
            -filter-mode=diff_context
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
